<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="266" viewBox="0 0 1200 266" role="img" aria-label="Journey: B.E. 2022, IJRASET 2025, AI Fellowship 2026, ICGCP-2026, graduated CGPA 8.9, joined Karix, next Spring Boot and AI">
  <title>Aniket Vishnu – journey timeline</title>
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="lnu" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0"><stop offset="0" stop-color="#d946ef"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="ng"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#110b2e"/><stop offset="1" stop-color="#07131f"/></linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
    .wh{fill:#22d3ee;font-size:12px;font-weight:700;letter-spacing:2px}
    .tt{fill:#f1f5f9;font-size:15px;font-weight:700}
    .sb{fill:#94a3b8;font-size:12.5px}
    .em{font-size:16px}
    .path{stroke-dasharray:1020;stroke-dashoffset:1020;animation:draw 3s ease-out .2s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .nd{opacity:0;animation:pop .6s ease-out forwards}
    @keyframes pop{from{opacity:0}to{opacity:1}}
    .halo{animation:pulse 2.6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.55}}
    .flow{stroke-dasharray:6 18;animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
  </style>
  <rect x="1" y="1" width="1198" height="264" rx="18" fill="url(#bg)" stroke="#ffffff" stroke-opacity=".08"/>
  <line x1="90" y1="128" x2="1110" y2="128" stroke="#ffffff" stroke-opacity=".06" stroke-width="6" stroke-linecap="round"/>
